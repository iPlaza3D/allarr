services:
  jackettvpn:
    image: dyonr/jackettvpn:latest
    container_name: JackettVPN
    environment:
      - VPN_ENABLED=yes
      - VPN_TYPE=openvpn
      - VPN_USERNAME=${VPN_USERNAME}
      - VPN_PASSWORD=${VPN_PASSWORD}
      # Con fichero propio, protocolo y puerto salen del .ovpn (colócalo en ./config/openvpn/)
      - VPN_CONFIG_FILE=${VPN_CONFIG_FILE}
      # Debe incluir la LAN y la red Docker, o allarr no podrá llegar a Jackett
      - LAN_NETWORK=192.168.1.0/24,172.16.0.0/12
      - NAME_SERVERS=1.1.1.1,8.8.8.8
      - WEBUI_PASSWORD=${WEBUI_PASSWORD}
      - PUID=1026
      - PGID=101
      - TZ=Europe/Madrid
    volumes:
      - ./config:/config
      - /volume1/Descargas:/downloads
    ports:
      - "9117:9117"
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    # Si el túnel cae o Jackett no responde (aunque el proceso siga vivo) el contenedor pasa a unhealthy y autoheal lo reinicia
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 10 --interface tun0 https://ipinfo.io/ip >/dev/null && curl -sf --max-time 10 -o /dev/null http://localhost:9117/UI/Dashboard || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  allarr:
    image: ${DOCKERHUB_USER:-tu_usuario}/allarr:latest
    build: .
    container_name: allarr
    environment:
      - TORZNAB_URL=http://JackettVPN:9117/api/v2.0/indexers/all/results/torznab/api
    volumes: ["./data:/data"]
    ports: ["8080:8080"]
    depends_on: [jackettvpn]
    restart: unless-stopped
