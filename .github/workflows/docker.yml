name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Comprobar secretos de Docker Hub
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$U" ] && echo "DOCKERHUB_USERNAME: OK (${#U} caracteres)" || echo "::error::DOCKERHUB_USERNAME vacío o inexistente"
          [ -n "$T" ] && echo "DOCKERHUB_TOKEN: OK (${#T} caracteres)" || echo "::error::DOCKERHUB_TOKEN vacío o inexistente"
          [ -n "$U" ] && [ -n "$T" ]
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/allarr:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/allarr:${{ github.ref_name }}
