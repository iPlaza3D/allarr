name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Comprobar token de Docker Hub
        env:
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$T" ] && echo "DOCKERHUB_TOKEN: OK (${#T} caracteres)" || { echo "::error::El secreto DOCKERHUB_TOKEN esta vacio o no existe en este repositorio"; exit 1; }
      - uses: docker/login-action@v3
        with:
          username: iplaza3d
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            iplaza3d/allarr:latest
            iplaza3d/allarr:${{ github.ref_name }}
